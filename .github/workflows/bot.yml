name: Long Short Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # SET UP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # RUN BOT
      # ============================================================
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # ============================================================
      # COMMIT UPDATED ALERT HISTORY
      # ============================================================
      - name: Commit alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alerts.json signals.json

          if git diff --cached --quiet; then
            echo "No alert history changes to commit."
          else
            git commit -m "Update alert history"
          fi

      # ============================================================
      # SYNC WITH REMOTE
      # FIXES: ! [rejected] main -> main (fetch first)
      # ============================================================
      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      # ============================================================
      # PUSH UPDATED HISTORY
      # ============================================================
      - name: Push alert history
        run: |
          git push origin HEAD:main
