name: Long Short Signal Bot

on:
  workflow_dispatch:

  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Prevent two bot runs from running at the same time.
# This is important because the bot updates alerts.json/signals.json.
concurrency:
  group: long-short-signal-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # SET UP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # RUN BOT
      # ============================================================

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # ============================================================
      # CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # SAVE LOCAL ALERT HISTORY
      # ============================================================

      - name: Commit alert history
        run: |
          git add alerts.json signals.json

          if git diff --cached --quiet; then
            echo "No alert history changes to commit."
          else
            git commit -m "Update alert history"
          fi

      # ============================================================
      # FETCH LATEST REMOTE VERSION
      #
      # IMPORTANT:
      # Another GitHub run may have updated alerts.json.
      # Fetch first, then rebase our local commit.
      # ============================================================

      - name: Fetch latest remote
        run: |
          git fetch origin main

      # ============================================================
      # REBASE ON LATEST REMOTE
      # ============================================================

      - name: Rebase on latest main
        run: |
          git rebase origin/main

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push alert history
        run: |
          git push origin HEAD:main

      # ============================================================
      # FINISHED
      # ============================================================

      - name: Finished
        run: |
          echo "Bot run completed successfully."
