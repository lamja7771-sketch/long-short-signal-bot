name: Long Short Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alerts.json signals.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No alert history changes to commit."
            exit 0
          fi

          git commit -m "Update alert history"

      - name: Sync with remote and push
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
