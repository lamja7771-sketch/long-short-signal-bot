name: Long Short Signal Bot

on:
  workflow_dispatch:

  schedule:
    # Run every 5 minutes, offset from GitHub's common high-load minutes
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: long-short-signal-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # RUN BOT
      # ============================================================

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # SAVE HISTORY
      # ============================================================

      - name: Commit alert history
        run: |
          git add alerts.json signals.json

          if git diff --cached --quiet; then
            echo "No alert history changes to commit."
          else
            git commit -m "Update alert history"
          fi

      # ============================================================
      # FETCH REMOTE
      # ============================================================

      - name: Fetch latest remote
        run: |
          git fetch origin main

      # ============================================================
      # REBASE
      # ============================================================

      - name: Rebase on latest main
        run: |
          git rebase origin/main

      # ============================================================
      # PUSH
      # ============================================================

      - name: Push alert history
        run: |
          git push origin HEAD:main

      # ============================================================
      # FINISHED
      # ============================================================

      - name: Finished
        run: |
          echo "Bot run completed successfully."
